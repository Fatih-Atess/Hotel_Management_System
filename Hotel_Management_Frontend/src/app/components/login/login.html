<header class="login-header">
    <h1>Sisteme Giriş</h1>
    <p>Lütfen yönetici bilgilerinizi giriniz</p>
</header>

<div class="login-container">
    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">

        <div class="form-group">
            <label for="username">Kullanıcı Adı</label>
            <input type="text" id="username" name="username" [(ngModel)]="loginData.username" required>
        </div>

        <div class="form-group">
            <label for="password">Şifre</label>
            <input type="password" id="password" name="password" [(ngModel)]="loginData.password" required>
        </div>

        @if(errorMessage){
        <div class="error-banner">
            {{ errorMessage }}
        </div>
        }

        <button type="submit" class="btn-login" [disabled]="!loginForm.valid">
            Giriş Yap
        </button>
    </form>
</div>
